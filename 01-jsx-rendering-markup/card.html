<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        display: flex;
        justify-content: center;
        padding: 2rem;
        background: #f0f2f5;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 1.5rem 2rem;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        width: 280px;
      }
      .name {
        font-size: 1.3rem;
        font-weight: 600;
        margin: 0 0 0.25rem;
      }
      .location {
        color: #555;
        font-size: 0.9rem;
        margin: 0 0 1rem;
      }
      .stats {
        display: flex;
        gap: 1.5rem;
        border-top: 1px solid #eee;
        padding-top: 1rem;
      }
      .stat-label {
        font-size: 0.75rem;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .stat-value {
        font-size: 1rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./card.jsx"></script>
  </body>
</html>
